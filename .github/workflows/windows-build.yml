name: Windows build

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Windows ${{ matrix.architecture }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: x64
            runner: windows-2025
          - architecture: arm64
            runner: windows-11-arm
    defaults:
      run:
        shell: pwsh
    env:
      COCKPIT_CI_ARCH: ${{ matrix.architecture }}
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
          architecture: ${{ matrix.architecture }}
          package-manager-cache: false

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      # Electron 42 installs its runtime lazily on first require. Download it
      # before Playwright starts a test's timeout on a cold hosted runner.
      - name: Prepare Electron runtime before timed tests
        run: node node_modules/electron/install.js

      # Actual hooks run after a PowerShell PTY is ready. Hosted x64 images can
      # take over five seconds on their very first PowerShell launch; perform
      # that cold initialization before the unit test's unchanged time limit.
      - name: Prepare PowerShell before timed hook tests
        run: powershell.exe -NoLogo -NoProfile -NonInteractive -Command '$PSVersionTable.PSVersion.ToString()'

      - name: Check types
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Run unit tests
        run: npm run test:unit

      - name: Build application and both editions
        run: |
          npm run build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run build:editions

      - name: Verify PowerShell, shared Codex, editions, symbols and subagents
        env:
          DEBUG: pw:browser
        run: npx --no-install playwright test tests/e2e/app.spec.ts tests/e2e/editions.spec.ts tests/e2e/codex-shared-start.spec.ts tests/e2e/circled-numbers.spec.ts tests/e2e/subagent-status.spec.ts tests/e2e/terminal-clipboard.spec.ts tests/e2e/ime-composition-wrap.spec.ts tests/e2e/ime-input-lifecycle.spec.ts tests/e2e/ime-stuck-input.spec.ts tests/e2e/preview-native.spec.ts

      - name: Package unsigned installers
        run: npm run package:editions -- --arch=$env:COCKPIT_CI_ARCH

      - name: Verify shared Codex startup in the packaged application
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $unpacked = if ($env:COCKPIT_CI_ARCH -eq 'x64') { 'win-unpacked' } else { 'win-arm64-unpacked' }
          $env:COCKPIT_PACKAGED_EXECUTABLE = Join-Path $PWD "release/$version/ja/$unpacked/CLI Cockpit.exe"
          npx --no-install playwright test tests/e2e/codex-shared-start.spec.ts tests/e2e/circled-numbers.spec.ts tests/e2e/subagent-status.spec.ts tests/e2e/preview-native.spec.ts

      - name: Collect installers, checksums and build metadata
        run: node scripts/collect-ci-artifacts.mjs --arch=$env:COCKPIT_CI_ARCH

      - name: Upload unsigned build artifacts
        id: unsigned-artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: unsigned-windows-${{ matrix.architecture }}
          path: release/ci/${{ matrix.architecture }}/
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

      - name: Preserve shared-start failure evidence
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: windows-test-${{ matrix.architecture }}-attempt-${{ github.run_attempt }}
          path: |
            test-results/codex-shared-start-*/error-context.md
            test-results/codex-shared-start-*/trace.zip
            test-results/codex-shared-start-*/fixture/calls.jsonl
            test-results/codex-shared-start-*/fixture/user-data/diagnostic.log
            test-results/preview-native-*/error-context.md
            test-results/preview-native-*/trace.zip
            test-results/preview-native-*/*.png
          if-no-files-found: ignore
          retention-days: 7

      # After Foundation acceptance, submit this step's artifact-id to SignPath.
      # Production signing must require a maintainer's manual approval.
      # This workflow does not sign, publish releases, or update the manifest.

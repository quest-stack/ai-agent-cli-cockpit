# Proposal: never enable or dispatch without the user's explicit exception to
# AGENTS.md's Actions shutdown. No Actions cache or artifact storage is used.
name: macOS trial

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cockpit-0216-macos-native
  cancel-in-progress: false

jobs:
  build:
    if: github.repository == 'quest-stack/ai-agent-cli-cockpit' && !github.event.repository.private
    name: Mac trial ${{ matrix.architecture }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 65
    permissions:
      contents: write # Job-scoped. Only private upload/proof steps explicitly export GH_TOKEN.
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: arm64
            runner: macos-15
          - architecture: x64
            runner: macos-15-intel
    defaults:
      run:
        shell: bash
    env:
      TARGET_ARCH: ${{ matrix.architecture }}
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      HOMEBREW_NO_AUTO_UPDATE: '1'
      HOMEBREW_NO_INSTALL_CLEANUP: '1'
    steps:
      - name: Check out the exact reviewed application source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 7950900615037edc5a20e5674a0a716a5c4b2f6b
          persist-credentials: false
      - name: Set up matching Node.js without Actions cache storage
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '22.23.4'
          architecture: ${{ matrix.architecture }}
          package-manager-cache: false
      - name: Verify source, OS and native architecture
        run: |
          test "$(git rev-parse HEAD)" = 7950900615037edc5a20e5674a0a716a5c4b2f6b
          node -e 'if(process.platform!=="darwin"||process.arch!==process.env.TARGET_ARCH)process.exit(1);console.log(JSON.stringify({node:process.version,platform:process.platform,arch:process.arch}));'
          if [ "$(sysctl -in sysctl.proc_translated 2>/dev/null || true)" = 1 ]; then
            echo 'A translated process cannot stand in for the native architecture check.'
            exit 1
          fi
      - name: Install locked dependencies and Electron
        run: |
          npm ci --no-audit --no-fund
          node node_modules/electron/install.js
      - name: Check types, lint, unit tests and runtime dependencies
        run: |
          npm run typecheck
          npm run lint
          npm run test:unit
          npm audit --omit=dev
      - name: Build the matching native terminal and renderer
        run: |
          npm run rebuild:native
          npm run build
      - name: Prepare existing media fixtures
        run: |
          if ! command -v ffmpeg >/dev/null 2>&1; then brew install ffmpeg; fi
          ffmpeg -version
      - name: Verify focused source Mac regressions
        run: |
          npx --no-install playwright test tests/e2e/macos-trial.spec.ts tests/e2e/circled-numbers.spec.ts tests/e2e/preview-native.spec.ts tests/e2e/preview-site.spec.ts tests/e2e/preview-lifecycle.spec.ts --grep 'circled headings|Mac Codex launcher|full-page capture copies|a real shell file delivery' --output test-results-source
          npx --no-install playwright test tests/e2e/circled-input.spec.ts --output test-results-source-ime
      - name: Build ad-hoc signed trial packages
        run: node scripts/build-macos-trial.mjs "$TARGET_ARCH"
      - name: Verify ZIP and read-only DMG match the tested signed app
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const cp = require('node:child_process');
          const crypto = require('node:crypto');
          const source = '7950900615037edc5a20e5674a0a716a5c4b2f6b';
          const arch = process.env.TARGET_ARCH;
          if (process.platform !== 'darwin' || !['arm64', 'x64'].includes(arch) || process.arch !== arch ||
              cp.execFileSync('git', ['rev-parse', 'HEAD'], { encoding: 'utf8' }).trim() !== source) throw Error('Native archive identity mismatch');
          const directory = path.resolve('release', 'mac-trial', arch);
          const original = path.join(directory, arch === 'arm64' ? 'mac-arm64' : 'mac', 'CLI Cockpit.app');
          const temporary = fs.mkdtempSync(path.join(process.env.RUNNER_TEMP, 'cockpit-archive-' + arch + '-'));
          const extracted = path.join(temporary, 'zip'), mount = path.join(temporary, 'dmg');
          fs.mkdirSync(extracted); fs.mkdirSync(mount);
          const digest = bytes => crypto.createHash('sha256').update(bytes).digest('hex');
          function inventory(bundle) {
            const root = fs.realpathSync(bundle), entries = [];
            function walk(directory) {
              for (const name of fs.readdirSync(directory).sort()) {
                const file = path.join(directory, name), stat = fs.lstatSync(file), relative = path.relative(root, file);
                if (stat.isSymbolicLink()) {
                  if (!fs.realpathSync(file).startsWith(root + path.sep)) throw Error('Bundle link escapes its own root');
                  entries.push({ file: relative, link: fs.readlinkSync(file) });
                } else if (stat.isDirectory()) walk(file);
                else if (stat.isFile()) entries.push({ file: relative, executable: Boolean(stat.mode & 0o111), sha256: digest(fs.readFileSync(file)) });
                else throw Error('Unexpected bundle entry type');
              }
            }
            walk(root);
            if (entries.length < 100) throw Error('Incomplete Mac bundle');
            cp.execFileSync('codesign', ['--verify', '--deep', '--strict', bundle], { stdio: 'inherit' });
            const machine = cp.execFileSync('lipo', ['-archs', path.join(bundle, 'Contents', 'MacOS', 'CLI Cockpit')], { encoding: 'utf8' }).trim();
            if (machine !== (arch === 'arm64' ? 'arm64' : 'x86_64')) throw Error('Wrong bundle architecture');
            return { entries, sha256: digest(JSON.stringify(entries)) };
          }
          const expected = inventory(original);
          cp.execFileSync('ditto', ['-x', '-k', path.join(directory, `CLI-Cockpit-0.2.16-mac-trial-${arch}.zip`), extracted]);
          const zip = inventory(path.join(extracted, 'CLI Cockpit.app'));
          if (zip.sha256 !== expected.sha256) throw Error('ZIP differs from the tested app');
          const dmgFile = path.join(directory, `CLI-Cockpit-0.2.16-mac-trial-${arch}.dmg`);
          cp.execFileSync('hdiutil', ['verify', dmgFile], { stdio: 'inherit' });
          let attached = false;
          try {
            cp.execFileSync('hdiutil', ['attach', '-readonly', '-nobrowse', '-mountpoint', mount, dmgFile], { stdio: 'inherit' });
            attached = true;
            const dmg = inventory(path.join(mount, 'CLI Cockpit.app'));
            if (dmg.sha256 !== expected.sha256) throw Error('DMG differs from the tested app');
            const report = { sourceCommit: source, architecture: arch, bundleFiles: expected.entries.length,
              bundleTreeSha256: expected.sha256, zipTreeSha256: zip.sha256, dmgTreeSha256: dmg.sha256,
              codeSignVerified: true, dmgChecksumVerified: true, dmgMountedReadOnly: true };
            fs.writeFileSync(path.join(directory, 'archive-verification.json'), JSON.stringify(report, null, 2), 'utf8');
            console.log(JSON.stringify(report));
          } finally {
            if (attached) cp.execFileSync('hdiutil', ['detach', mount], { stdio: 'inherit' });
          }
          
          NODE
      - name: Verify the packaged app and its signature
        run: |
          bundle_dir=mac
          if [ "$TARGET_ARCH" = arm64 ]; then bundle_dir=mac-arm64; fi
          bundle="release/mac-trial/$TARGET_ARCH/$bundle_dir/CLI Cockpit.app"
          codesign --verify --deep --strict "$bundle"
          file "$bundle/Contents/MacOS/CLI Cockpit"
          export COCKPIT_PACKAGED_EXECUTABLE="$PWD/$bundle/Contents/MacOS/CLI Cockpit"
          npx --no-install playwright test tests/e2e/macos-trial.spec.ts tests/e2e/circled-numbers.spec.ts tests/e2e/preview-native.spec.ts tests/e2e/preview-site.spec.ts tests/e2e/preview-lifecycle.spec.ts tests/e2e/circled-input.spec.ts --output test-results-package
      - name: Attach verified packages directly to the private draft
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node <<'NODE'
          // Reviewed proposal only. This does not enable or dispatch GitHub Actions.
          const fs = require('node:fs');
          const path = require('node:path');
          const crypto = require('node:crypto');
          const { execFileSync } = require('node:child_process');
          
          (async () => {
            const source = '7950900615037edc5a20e5674a0a716a5c4b2f6b';
            const repository = 'quest-stack/ai-agent-cli-cockpit';
            const releaseId = 436098969;
            const architecture = process.env.TARGET_ARCH;
            if (process.platform !== 'darwin' || !['arm64', 'x64'].includes(architecture) || process.arch !== architecture) {
              throw Error('Use the matching native Mac runner');
            }
            if (process.env.GITHUB_REPOSITORY !== repository || !/^\d+$/.test(process.env.GITHUB_RUN_ID ?? '') ||
                execFileSync('git', ['rev-parse', 'HEAD'], { encoding: 'utf8' }).trim() !== source) {
              throw Error('Repository or application source mismatch');
            }
            if (!process.env.GH_TOKEN) throw Error('Missing job-scoped upload token');
            const version = JSON.parse(fs.readFileSync('package.json', 'utf8')).version;
            if (version !== '0.2.16') throw Error('Unexpected release version');
            const directory = path.resolve('release', 'mac-trial', architecture);
            const archiveVerification = JSON.parse(fs.readFileSync(path.join(directory, 'archive-verification.json'), 'utf8'));
            if (archiveVerification.sourceCommit !== source || archiveVerification.architecture !== architecture ||
                archiveVerification.bundleFiles < 100 || !/^[a-f0-9]{64}$/.test(archiveVerification.bundleTreeSha256) ||
                archiveVerification.zipTreeSha256 !== archiveVerification.bundleTreeSha256 ||
                archiveVerification.dmgTreeSha256 !== archiveVerification.bundleTreeSha256 ||
                archiveVerification.codeSignVerified !== true || archiveVerification.dmgChecksumVerified !== true ||
                archiveVerification.dmgMountedReadOnly !== true) throw Error('Archive verification is incomplete');
            const digest = content => crypto.createHash('sha256').update(content).digest('hex');
            const files = ['dmg', 'zip'].map(extension => {
              const name = `CLI-Cockpit-${version}-mac-trial-${architecture}.${extension}`;
              const file = path.join(directory, name);
              const stat = fs.lstatSync(file);
              if (!stat.isFile() || stat.isSymbolicLink()) throw Error('Unsafe artifact type');
              const content = fs.readFileSync(file);
              if (extension === 'zip' && (content.length < 4 || content.readUInt32LE(0) !== 0x04034b50)) throw Error('Invalid ZIP');
              if (extension === 'dmg' && (content.length < 512 || content.subarray(-512, -508).toString('ascii') !== 'koly')) throw Error('Invalid DMG');
              return { name, file, bytes: content.length, sha256: digest(content) };
            });
            const metadata = {
              sourceCommit: source, workflowRevision: process.env.GITHUB_SHA,
              workflowRun: `https://github.com/${repository}/actions/runs/${process.env.GITHUB_RUN_ID}`,
              version, platform: process.platform, architecture, nodeVersion: process.version,
              signing: 'ad-hoc; not Developer ID signed or notarized',
              archiveVerification,
              installers: files.map(({ name, bytes, sha256 }) => ({ name, bytes, sha256 })),
            };
            const metadataName = `build-metadata-macos-${architecture}.json`;
            const checksumsName = `SHA256SUMS-macos-${architecture}.txt`;
            fs.writeFileSync(path.join(directory, metadataName), JSON.stringify(metadata, null, 2) + '\n', 'utf8');
            fs.writeFileSync(path.join(directory, checksumsName), files.map(item => `${item.sha256}  ${item.name}`).join('\n') + '\n', 'utf8');
            for (const name of [metadataName, checksumsName]) {
              const file = path.join(directory, name), content = fs.readFileSync(file);
              files.push({ name, file, bytes: content.length, sha256: digest(content) });
            }
          
            const headers = { Authorization: `Bearer ${process.env.GH_TOKEN}`, Accept: 'application/vnd.github+json' };
            const endpoint = `https://api.github.com/repos/${repository}`;
            const read = async suffix => {
              const response = await fetch(endpoint + suffix, { headers, signal: AbortSignal.timeout(60000) });
              if (!response.ok) throw Error(`GitHub read failed: ${response.status}`);
              return response.json();
            };
            const release = await read(`/releases/${releaseId}`);
            const matchingTag = release.tag_name === `v${version}` ||
              release.tag_name === 'untagged-112faa7e7cd14f57f991' && release.name?.startsWith(`v${version} - `);
            if (!release.draft || !matchingTag || release.target_commitish !== source) {
              throw Error('Upload only to the matching unpublished candidate');
            }
            const uploadUrl = release.upload_url.replace(/\{.*$/, '');
            if (new URL(uploadUrl).hostname !== 'uploads.github.com') throw Error('Unexpected upload host');
            const existing = await read(`/releases/${releaseId}/assets?per_page=100`);
            for (const item of files) {
              let asset = existing.find(candidate => candidate.name === item.name);
              if (asset) {
                if (asset.state !== 'uploaded') throw Error('Existing upload outcome is unknown; reconcile before retry');
                if (asset.size === item.bytes && asset.digest === `sha256:${item.sha256}`) continue;
                // Replace only this architecture's four named assets in this private draft.
                const response = await fetch(endpoint + `/releases/assets/${asset.id}`, { method: 'DELETE', headers });
                if (response.status !== 204) throw Error(`Draft asset replacement failed: ${response.status}`);
              }
              const response = await fetch(uploadUrl + '?name=' + encodeURIComponent(item.name), {
                method: 'POST', headers: { ...headers, 'Content-Type': 'application/octet-stream', 'Content-Length': String(item.bytes) },
                body: fs.readFileSync(item.file), signal: AbortSignal.timeout(600000),
              });
              if (!response.ok) throw Error(`Upload failed: ${response.status}; reconcile before retry`);
              asset = await response.json();
              if (asset.state !== 'uploaded' || asset.size !== item.bytes || asset.digest !== `sha256:${item.sha256}`) {
                throw Error('Uploaded artifact digest mismatch');
              }
              console.log(`Verified draft asset ${item.name}: ${item.sha256}`);
            }
            if (!(await read(`/releases/${releaseId}`)).draft) throw Error('Release unexpectedly published');
          })().catch(error => { console.error(error.message); process.exitCode = 1; });
          
          NODE
      - name: Save native drawing and failure proof in the private draft
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node <<'NODE'
          const fs=require('node:fs'),path=require('node:path'),cp=require('node:child_process'),crypto=require('node:crypto');
          (async()=>{
           const source='7950900615037edc5a20e5674a0a716a5c4b2f6b',repository='quest-stack/ai-agent-cli-cockpit',id=436098969,arch=process.env.TARGET_ARCH;
           if(process.platform!=='darwin'||!['arm64','x64'].includes(arch)||process.arch!==arch||process.env.GITHUB_REPOSITORY!==repository||cp.execFileSync('git',['rev-parse','HEAD'],{encoding:'utf8'}).trim()!==source)throw Error('Native proof identity mismatch');
           const roots=['test-results-source','test-results-source-ime','test-results-package','test-results-package-ime','test-results-visual','test-results-visual-ime'];
           const directory=path.join(process.env.RUNNER_TEMP,'cockpit-proof-'+arch);fs.mkdirSync(directory,{recursive:true});const files=[];let bytes=0;
           function collect(root,dir=root){if(!fs.existsSync(dir))return;for(const entry of fs.readdirSync(dir,{withFileTypes:true})){const from=path.join(dir,entry.name);if(entry.isSymbolicLink())continue;if(entry.isDirectory()){if(!['profile','data','fixture','user-data','home'].includes(entry.name))collect(root,from);continue;}if(!entry.name.endsWith('.png')&&entry.name!=='error-context.md'&&!['.last-run.json','terminal-output.log','shell-diagnosis.json','bottom-geometry.json','dom-geometry.json','dom-spans.json'].includes(entry.name))continue;const stat=fs.statSync(from);bytes+=stat.size;if(bytes>40*1024*1024||files.length>=250)throw Error('Proof size limit');const relative=path.join(root,path.relative(root,from));const to=path.join(directory,relative);fs.mkdirSync(path.dirname(to),{recursive:true});fs.copyFileSync(from,to);files.push({file:relative,bytes:stat.size});}}
           for(const root of roots)collect(root);if(!files.length)throw Error('No native drawing proof produced');
           fs.writeFileSync(path.join(directory,'SUMMARY.json'),JSON.stringify({sourceCommit:source,architecture:arch,run:process.env.GITHUB_RUN_ID,files},null,2));
           const archive=path.join(process.env.RUNNER_TEMP,`qa-macos-${arch}.zip`);cp.execFileSync('ditto',['-c','-k','--norsrc',directory,archive]);const content=fs.readFileSync(archive),sha=crypto.createHash('sha256').update(content).digest('hex'),headers={Authorization:'Bearer '+process.env.GH_TOKEN,Accept:'application/vnd.github+json'};
           const endpoint='https://api.github.com/repos/'+repository;const read=async suffix=>{const r=await fetch(endpoint+suffix,{headers});if(!r.ok)throw Error('Proof read '+r.status);return r.json();};const release=await read('/releases/'+id);if(!release.draft||release.target_commitish!==source)throw Error('Proof requires matching private draft');const name=path.basename(archive),existing=release.assets.find(a=>a.name===name);
           if(existing){if(existing.state!=='uploaded')throw Error('Uncertain proof upload');const r=await fetch(endpoint+'/releases/assets/'+existing.id,{method:'DELETE',headers});if(r.status!==204)throw Error('Proof replacement '+r.status);}
           const upload=new URL(release.upload_url.split('{')[0]);if(upload.hostname!=='uploads.github.com'||!upload.pathname.endsWith('/releases/'+id+'/assets'))throw Error('Unexpected proof endpoint');upload.searchParams.set('name',name);const r=await fetch(upload,{method:'POST',headers:{...headers,'Content-Type':'application/octet-stream','Content-Length':String(content.length)},body:content});if(!r.ok)throw Error('Proof upload '+r.status);const asset=await r.json();if(asset.digest!=='sha256:'+sha||asset.size!==content.length)throw Error('Proof digest mismatch');console.log(JSON.stringify({name,sha256:sha,bytes:content.length,files:files.length,sourceCommit:source}));
          })().catch(e=>{console.error(e.message);process.exitCode=1;});
          
          NODE


name: macOS trial

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: macos-trial-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Mac trial ${{ matrix.architecture }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: arm64
            runner: macos-15
          - architecture: x64
            runner: macos-15-intel
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Set up native Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
          architecture: ${{ matrix.architecture }}
          package-manager-cache: false
      - name: Install locked dependencies and Electron
        run: |
          npm ci --no-audit --no-fund
          node node_modules/electron/install.js
      - name: Check types, lint and unit tests
        run: |
          npm run typecheck
          npm run lint
          npm run test:unit
      - name: Rebuild native terminal for Electron and build application
        run: |
          npm run rebuild:native
          npm run build
      - name: Verify real Mac shell, screenshot paste and pane controls
        run: npx --no-install playwright test tests/e2e/macos-trial.spec.ts
      - name: Build ad-hoc-signed trial packages
        run: node scripts/build-macos-trial.mjs ${{ matrix.architecture }}
      - name: Verify the packaged application
        shell: bash
        run: |
          bundle_dir=mac
          if [[ '${{ matrix.architecture }}' == 'arm64' ]]; then bundle_dir=mac-arm64; fi
          bundle="release/mac-trial/${{ matrix.architecture }}/$bundle_dir/CLI Cockpit.app"
          codesign --verify --deep --strict "$bundle"
          file "$bundle/Contents/MacOS/CLI Cockpit"
          COCKPIT_PACKAGED_EXECUTABLE="$PWD/$bundle/Contents/MacOS/CLI Cockpit" npx --no-install playwright test tests/e2e/macos-trial.spec.ts
      - name: Collect packages, guide and checksums
        run: node scripts/collect-macos-trial.mjs ${{ matrix.architecture }}
      - name: Upload trial packages
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: cockpit-mac-trial-${{ matrix.architecture }}
          path: release/ci/mac-${{ matrix.architecture }}/
          retention-days: 14
          if-no-files-found: error
          compression-level: 0
      - name: Upload test evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: cockpit-mac-test-${{ matrix.architecture }}
          path: test-results/
          retention-days: 7
          if-no-files-found: ignore
